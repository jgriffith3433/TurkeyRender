# The proofs of the real-scale space set. Each card puts the near world somewhere in the far one with a focus, then shoots it.
- id: p_speck
  idea: he is a speck against Saturn's rings
  feel: tiny
  tags: [offmark]
  cast: {person: {at: arr_him, clip: gm_zg_idle, blend: 0}}
  camera: {preset: spot, from: arr_cam_speck, on: arr_him, lens: 50}
  shot: {pos: [25, 26, 8870], look: null, rot: [-1.7, -10.9, 0], fov: 32, deadzone: false}
  raw:
    - {at: 0, do: focus, on: space_epic_space, name: arrival_rings, for: 0}

