  cast: {person: {at: bed, clip: mx_sit_still}, doctor: {at: doctor_side, clip: IdleBreathe, look: person}}
  camera: {preset: spot, from: cam_bed_cu, on: person.head, lens: 55}
  shot: {screen: [0, -0.47], deadzone: false}
