# The shot checks' proof. bad_ cards reproduce the Hawkes Punch slice's camera and staging faults; good_ cards are their controls and should pass.
- id: good_cu
  idea: control, his face on the bed, eyes on a third
  feel: plain
  cast: {person: {at: bed, clip: mx_sit_still, blend: 0}, doctor: {at: doctor_side, clip: IdleBreathe, blend: 0, look: person}}
  camera: {preset: spot, from: cam_bed_cu, on: person.head, lens: 55}
  raw:
    - {at: 0, gfx: lower, title: "A REAL DOCTOR", sub: "Not looking up", color: "#ff2a6a", for: 4b}
    - {at: 0, gfx: bug, text: "HAWKES PUNCH", box: "#ff2a6a", for: 4b}
- id: bad_eyes
  idea: frame fault, his eyes composed past the top of the frame
  feel: wrong
  cast: {person: {at: bed, clip: mx_sit_still}, doctor: {at: doctor_side, clip: IdleBreathe, look: person}}
  camera: {preset: spot, from: cam_bed_cu, on: person.head, lens: 55}
  shot: {screen: [0, 0.56], deadzone: false}
- id: bad_cut_top
  idea: frame fault, his eyes composed at the very top so the top of his face is cut off
