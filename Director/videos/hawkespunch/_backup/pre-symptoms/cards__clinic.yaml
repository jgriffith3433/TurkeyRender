# Hawkes Punch, the clinic: waiting room, consultation, the line, the punch, and the button. Clinic origin is [700,0,0]. Marks: library/sets/clinic.json.
# Restaged 2026-11-07 (J: clipping, strange arms): no body contact between them, ever. The exam is her beside him gesturing and him reacting, in singles and
# a wide. The prescription moves him to the chair at the desk (desk_chair) with her behind it (desk_stand): she slides the can across the desk top, an insert
# of his hand closing on it, him with it at his chest. The punch: wind-up in the two-shot, a hard cut on the hit to his face snapping back; her fist never meets
# his face on screen. The doctor (Person2) plays clips only: stand, g_* layers, doctor_slide_can, doctor_punch, doctor_fist_offscreen; no keys-based takes.

# ---- 1. waiting room (bars 1-4)
- id: w_clock
  idea: a clinic at the hour nobody wants, a turkey nurse on the reception counter, nothing moving but the clock
  feel: sick, small, pale green
  cast: {nurse: reception_counter clip:idle}
  camera: {preset: spot, from: cam_reception, on: cam_reception_aim, lens: 32}

- id: w_sits
  idea: he on a waiting chair, slumped and green, a cough
  feel: small
  cast: {person: {at: waiting_seat, perform: sit_bed_sick, args: {cough: 1.4, look: 9}}, nurse: reception_counter clip:idle}
  camera: {preset: spot, from: cam_waiting, on: person, lens: 75}

- id: w_ahh
  idea: "say ahh": alone in the frame, his jaw drops wide for a doctor we don't see yet
  feel: ridiculous
  cast: {person: {at: bed, perform: tongue_out, args: {to: [0, 0.6, 1.2], open: 0.85}}, doctor: {at: doctor_side, perform: stand}}
  camera: {preset: spot, from: cam_bed_cu, on: person, lens: 65}

- id: w_nurse
  idea: the nurse looks round at him and does not blink
  feel: she has seen a thousand like him
  cast: {nurse: reception_counter clip:idle}
  camera: {preset: spot, from: cam_nurse_cu, on: nurse, lens: 32}
  raw:
    - {at: 1.5b, do: rotate, on: nurse, rot: [0, 150, 0], for: 0.25s, ease: out}

# ---- 2. the consultation (bars 5-16). She stands beside the bed head (doctor_side), an arm's length off, and never touches him.
- id: c_wide
  idea: the room on the drop: he on the paper bed looking green, she beside him pointing him through it
  feel: in good hands
  cast: {person: {at: bed, perform: sit_bed_sick, args: {cough: 9, look: 9}}, doctor: {at: doctor_side, perform: stand, look: person}}
  camera: {preset: spot, from: cam_room_wide, on: cam_room_aim, lens: 24}

- id: c_eyes
  idea: his face: his eyes follow her, wary, a slow blink
  feel: being read
  cast: {person: {at: bed, perform: sit_bed_sick, look: doctor}, doctor: {at: doctor_side, perform: stand}}
  camera: {preset: spot, from: cam_bed_cu, on: person, lens: 65}
  events:
    - {on: 1.2b, who: person, do: blink, for: 0.25s}
    - {on: 2.6b, who: person, do: face, eyesWide: 0.3, for: 0.3s}
    - {on: 3.6b, who: person, do: face, eyesWide: 0, for: 0.4s}

- id: c_steth
  idea: she listens, still; he holds his breath for her
  feel: calm, routine
  cast: {person: {at: bed, perform: sit_bed_sick}, doctor: {at: doctor_side, perform: stand, look: person}}
  camera: {preset: spot, from: cam_bed_side, on: cam_bed_side_aim, lens: 50}
  raw:
    - {at: 0.2b, do: perform, on: person, name: breathe_deep, for: 3.6s}

- id: c_knee
  idea: the knee tap, cut on the tap: his leg kicks out on its own and he grins at it
  feel: ha
  cast: {person: {at: bed, perform: knee_tap_react, args: {leg: 1, kick: 40}}, doctor: {at: doctor_side, perform: stand, look: person}}
  camera: {preset: spot, from: cam_bed_side, on: person, lens: 40}
  events:
    - {on: 0.2b, sfx: frame_tick, volume: 0.6}

- id: c_sing
  idea: he looks straight at us from the bed, green, while she writes at the desk
  feel: he is telling us how it went
  sing: person
  cast: {person: {at: bed, perform: sit_bed_sick, args: {cough: 9, look: 9}}, doctor: {at: desk_stand, perform: stand}}
  camera: {preset: spot, from: cam_bed_cu, on: person, lens: 65}

- id: c_sing_side
  idea: the same from high in the corner: the whole pale room, him small on the bed, her at the desk
  feel: routine, a little too bright
  sing: person
  cast: {person: {at: bed, perform: sit_bed_sick}, doctor: {at: desk_stand, perform: stand}}
  camera: {preset: spot, from: cam_high, on: person, lens: 30}

# ---- the desk (bars 13-16): he is in the patient's chair now, she behind the desk
- id: d_pad
  idea: "wrote a word down on a page": over the desk, she nods at the pad and writes the word
  feel: official
  cast: {person: {at: desk_chair, perform: sit_idle}, doctor: {at: desk_stand, perform: stand}}
  camera: {preset: spot, from: cam_desk_wide, on: doctor, lens: 45}
  raw:
    - {at: 0.3b, do: gaze, on: doctor, to: [701.42, 0.76, 1.5], for: 0.4s, ease: inout}
    - {at: 3.4b, do: gaze, on: doctor, to: person.head, for: 0.4s, ease: inout}

- id: d_face
  idea: "a case of life": his face, reassured, a small smile arrives
  feel: relief
  sing: person
  cast: {person: {at: desk_chair, perform: sit_idle}, doctor: {at: desk_stand, perform: stand}}
  camera: {preset: spot, from: cam_over_desk, on: person, lens: 65}
  events:
    - {on: 1b, who: person, do: perform, name: smile_small, amount: 0.6, hold: 1.5}

- id: d_can
  idea: the red can slides across the desk top under her hand, "every day until the symptoms go away"
  feel: that's it?
  cast: {person: {at: desk_chair, perform: sit_idle}, doctor: {at: desk_stand, perform: doctor_slide_can, args: {can: can, patient: person, dx: 0.2, dz: -0.42}}, can: {at: can_desk}}
  camera: {preset: spot, from: cam_can, on: can_slide_to, lens: 50}

- id: d_take
  idea: an insert: his hand closes on the can on the desk; then he has it at his chest and looks at her
  feel: okay then
  cast: {person: {at: desk_chair, perform: sit_idle, look: doctor}, doctor: {at: desk_stand, perform: stand}, can: {at: can_desk}}
  camera: {preset: spot, from: cam_can, on: can_slide_to, lens: 50}
  shot: {pos: [700.5, 1.05, 0.7], look: can, rot: null, fov: 32}
  raw:
    - {at: 0, do: set, on: can, pos: [701.05, 0.755, 1.3], rot: [0, 30, 0]}
    - {at: 0.1s, do: gaze, on: person, to: can, for: 0.3s, ease: inout}
    - {at: 0.15s, do: reach, on: person, hand: right, to: can, offset: [0, 0.03, 0], for: 0.6s, ease: hand}
    - {at: 0.2s, do: fingers, on: person, hand: right, set: 0.12, for: 0.4s, ease: inout}
    - {at: 0.75s, do: fingers, on: person, hand: right, set: 0.6, for: 0.16s}
    - {at: 0.9s, do: attach, on: can, to: person.rightHand, pos: [0.004, 0.072, -0.05], rot: [0, 0, 90], blend: 0.08s}
    - {at: 1.0s, do: reach, on: person, hand: right, weight: 0, for: 0.9s, ease: inout}
    - {at: 1.2s, do: gaze, on: person, to: doctor.head, for: 0.5s, ease: inout}

# ---- 3. the line (bars 17-21). Her spoken line is acts/70-lines.json (43.2-53.0 s). Singles: nobody's hands near anybody's head.
- id: l_turn
  idea: she lifts her eyes from the pad to him and the room goes still
  feel: something changed
  mood: clinic_still
  cast: {person: {at: desk_chair, perform: sit_idle}, doctor: {at: desk_stand, perform: stand}, can: {at: can_desk}}
  camera: {preset: spot, from: cam_desk_wide, on: doctor, lens: 55}
  raw:
    - {at: 0, do: gaze, on: doctor, to: [701.42, 0.76, 1.5], for: 0}
    - {at: 1.2b, do: gaze, on: doctor, to: person.head, for: 1.1s, ease: inout}
    - {at: 1.2b, do: face, on: doctor, smile: 0, eyesWide: 0.12, for: 1.0s}

- id: l_line
  idea: her face, flat and still, the line; nothing on it moves but the mouth and one slow blink
  feel: uh oh
  mood: clinic_still
  cast: {person: {at: desk_chair, perform: sit_idle}, doctor: {at: desk_stand, perform: stand}, can: {at: can_desk}}
  camera: {preset: close-up, on: doctor, lens: 85, push: 0.1}
  raw:
    - {at: 0, do: gaze, on: doctor, to: person.head, for: 0}
    - {at: 2.6b, do: blink, on: doctor, for: 0.3s}

- id: l_react
  idea: him listening, the can at his chest, a swallow
  feel: this isn't going well
  mood: clinic_still
  cast: {person: {at: desk_chair, perform: sit_idle, look: doctor}, doctor: {at: desk_stand, perform: stand}, can: {at: can_desk}}
  camera: {preset: spot, from: cam_over_desk, on: person, lens: 55}
  events:
    - {on: 1b, who: person, do: face, fear: 0.18, for: 0.6s}
    - {on: 2.4b, who: person, do: blink, for: 0.25s}

- id: l_mouth
  idea: the drums stop; he opens his mouth to answer and nothing comes
  feel: don't
  mood: clinic_still
  cast: {person: {at: desk_chair, perform: mouth_open_about_to_speak, args: {to: [-0.6, 1.35, 1.5]}}, doctor: {at: desk_stand, perform: doctor_punch, args: {hit: 3.14, patient: person}}, can: {at: can_desk}}
  camera: {preset: spot, from: cam_over_desk, on: person, lens: 65}

# ---- 4. the punch (22:1, 52.99 s) and the flight
- id: p_hit
  idea: the two-shot: her wind-up, weight back, the fist cocked
  feel: oh no
  mood: clinic_still
  cast: {person: {at: desk_chair, perform: mouth_open_about_to_speak}, doctor: {at: desk_stand, perform: doctor_punch}, can: {at: can_desk}}
  camera: {preset: spot, from: cam_desk_wide, on: cam_desk_aim, lens: 30}

- id: p_face
  idea: hard cut on the hit: his face snaps back with a held flash and he is gone out of the frame; her fist is never in it
  feel: WHOA
  mood: punch_whoa
  cast: {person: {at: desk_chair}, doctor: {at: desk_stand, perform: doctor_punch}, can: {at: can_desk}}
  camera: {preset: spot, from: cam_over_desk, on: person, lens: 65}
  raw:
    - {at: 0, fx: impact, on: person.head, size: 1.3, shake: 0.5, hitstop: 3, color: "#ffcc70", sfx: impact_big, sfxVolume: 1}
    - {at: 0, do: perform, on: person, name: punched_away, fly: 1.6, impulse: [0, 0.4, 0.9], spin: 320, seed: 3, for: 9s}
    - {at: 0, do: fly, on: person, fromHere: 1, points: [[700.9, 1.4, 2.4], [700.6, 1.8, 4.6], [700.6, 3.4, 6.8], [700.6, 7.5, 12], [700.6, 17, 25], [700.6, 33, 45], [700.6, 58, 74], [700.6, 95, 115], [700.6, 140, 165]], for: 9.4s, ease: linear, trail: {lines: 16, width: 0.35}}
    - {at: 0.12s, do: shatter, on: clinic_window_glass, dir: [0, 0.25, 1], count: 180, push: 7, sfx: glass_ring, sfxVolume: 0.9}
    - {at: 0.12s, do: jump, on: clinic_window_blind, pos: [700.9, 0.4, 7.6], height: 2.4, for: 1.1s}
    - {at: 0.12s, do: rotate, on: clinic_window_blind, rot: [80, 0, 30], for: 1.1s, ease: linear}
    - {at: 0.2s, do: jump, on: clinic_roof_plug, pos: [702.4, 3.0, 6.2], height: 5, for: 1.5s}
    - {at: 0.2s, do: rotate, on: clinic_roof_plug, rot: [110, 30, 50], for: 1.5s, ease: linear}
    - {at: 0.2s, do: jump, on: clinic_ceiling_plug, pos: [701.4, 2.7, 5.4], height: 3.2, for: 1.3s}
    - {at: 0.2s, do: rotate, on: clinic_ceiling_plug, rot: [120, 0, 20], for: 1.3s, ease: linear}
    - {at: 0.05s, do: detach, on: can}
    - {at: 0.06s, do: fly, on: can, fromHere: 1, points: [[701.1, 1.6, 3.0], [700.8, 2.4, 5.3], [700.8, 6, 11], [700.9, 15, 23], [700.9, 30, 42], [700.9, 54, 70], [700.9, 90, 110], [700.9, 134, 158]], for: 9.3s, ease: linear, roll: 2200}

- id: p_glass
  idea: from outside, pulled back: the clinic, the window bursting, the roof plug popping, a man going straight up out of it
  feel: speed
  mood: punch_whoa
  cast: {person: {at: desk_chair}, doctor: {at: desk_stand, perform: doctor_punch}, can: {at: can_desk}}
  camera: {preset: spot, from: cam_outside, on: cam_outside_aim, lens: 24}
  shot: {pos: [703.5, 1.4, 15.5], look: aim_roof, rot: null, fov: 60}

- id: p_travel
  idea: one travelling shot riding beside him up through the clouds as the sky goes deep blue and the stars come out, speed lines, the can tumbling after
  feel: and up, and up, and up
  mood: punch_whoa
  cast: {person: {at: desk_chair}, can: {at: can_desk}}
  camera: {preset: spot, from: cam_sky, on: person, lens: 32}
  shot: {follow: person, offset: [2.6, 1.0, -5.5], lag: 0.12, lead: 0.25, look: person.chest, rot: null, fov: 44}
  raw:
    - {at: 0, sky: {top: "#9fc3e4", mid: "#d6e8f6", bottom: "#eaf0ea", clouds: 0.55, cloudColor: "#ffffff", cloudShade: "#b9c6d2", cloudScale: 1.4, cloudSoft: 0.3, stars: 0, density: 0}, for: 0}
    - {at: 2b, sky: {top: "#05081c", mid: "#080c24", bottom: "#16204a", clouds: 0.0, stars: 1, ambient: "#1a2040", density: 0}, for: 6.5s, ease: in}
    - {at: 6b, grade: {exposure: 0.45}, for: 5s, ease: in}
    - {at: 3b, fx: dust, on: person.chest, count: 300, color: "#ffffff", for: 3b}
    - {at: 2b, light: clinic_clinic_fluorescent_key, intensity: 2.4, for: 9s}
    - {at: 6b, do: perform, on: person, name: fly_fast, amp: 1.4, for: 8b}

# ---- 10. the button (70:1, 173.74 s)
- id: b_room
  idea: hard cut, the exam room again, him on the bed, green, looking at us
  feel: wait
  mood: clinic_flat
  sing: person
  cast: {person: {at: bed, perform: sit_bed_sick, args: {cough: 9, look: 9}}, doctor: {at: doctor_side, face: 110, perform: doctor_fist_offscreen, args: {hit: 0.63}}}
  camera: {preset: spot, from: cam_bed_cu, on: person, lens: 65}
  raw:
    - {at: 0, do: fingers, on: person, hand: right, release: 1, for: 0}
    - {at: 0, do: fingers, on: person, hand: left, release: 1, for: 0}

- id: b_fist
  idea: the fist comes in from off screen and the frame goes black the instant it would land
  feel: punchline
  mood: button_dark
  cast: {person: {at: bed, perform: sit_bed_sick}, doctor: {at: doctor_side, perform: doctor_fist_offscreen}}
  camera: {preset: spot, from: cam_bed_cu, on: person, lens: 65}
  raw:
    - {at: 0, fx: impact, on: person.head, size: 0.9, shake: 0.5, hitstop: 2, color: "#ffcc70", sfx: impact_big, sfxVolume: 0.9}
    - {at: 0, grade: {exposure: -14}, for: 0.02s}

- id: b_black
  idea: black
  feel: a held breath
  mood: button_dark
  cast: {person: {at: bed}}
  camera: {preset: spot, from: cam_bed_cu, on: person, lens: 65}
  raw:
    - {at: 0, grade: {exposure: -14}, for: 0}

- id: b_can
  idea: the can rolls into frame along the clinic floor and stops; HAWKES PUNCH
  feel: punchline
  mood: button_dark
  cast: {can_roll: {at: door_out}}
  camera: {preset: spot, from: cam_door, on: can_roll, lens: 40}
  shot: {pos: [700.2, 0.16, -1.9], look: can_roll, rot: null, fov: 30, aperture: 2}
  raw:
    - {at: 0, grade: {exposure: -0.35}, for: 0}
    - {at: 0, do: set, on: can_roll, pos: [701.6, 0.034, -0.8], rot: [0, 0, 90]}
    - {at: 0.05s, do: move, on: can_roll, pos: [701.6, 0.034, -2.3], for: 1.7s, ease: out}
    - {at: 0.05s, do: rotate, on: can_roll, rot: [2520, 0, 90], for: 1.7s, ease: out}
    - {at: 0.58s, text: "HAWKES PUNCH", style: slam, size: 112, color: "#c01020", pos: [0.5, 0.5, 0], for: 2.9s}
