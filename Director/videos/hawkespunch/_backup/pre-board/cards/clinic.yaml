# Hawkes Punch, the clinic, on the native path (2026-11-07): Unity's Animator plays every body from clips (library/clips.json, the clean copies in
# Motion/Clean), and only reach, gaze, eyes, fingers and the face go on top. No keys, poses, stances or bakes. Clinic origin is [700,0,0].
# He stays on the paper bed (mark bed, facing -z) the whole visit; she is beside him for the exam, at the desk (desk_doc, writing_seated) for the
# symptoms and the prescription, and stands in front of him (doctor_stand) for the line and the punch, so he flies back through the window behind him.
# No body contact: the can is tossed and caught, the punch cuts on the hit to his face snapping back.

# ---- 1. waiting room (bars 1-4)
- id: w_clock
  idea: a clinic at the hour nobody wants, a turkey nurse on the reception counter, nothing moving but the clock
  feel: sick, small, pale green
  cast: {nurse: reception_counter clip:idle}
  camera: {preset: spot, from: cam_reception, on: cam_reception_aim, lens: 32}

- id: w_sits
  idea: he on a waiting chair, slumped and green, two coughs
  feel: small
  cast: {person: {at: waiting_seat, clip: sit_cough, blend: 0}, nurse: reception_counter clip:idle}
  camera: {preset: spot, from: cam_waiting, on: person, lens: 75}
  shot: {look: null, lookOffset: null, screen: null, rot: [1.2, 75.6, 0], deadzone: false}   # the look aim lost him after the 2026-11-08 engine change; a fixed aim on his head
  raw:
    - {at: 0, do: face, on: person, fear: 0.08, smile: 0, for: 0}

- id: w_ahh
  idea: say ahh: alone in the frame, his jaw drops wide for a doctor we don't see yet
  feel: ridiculous
  cast: {person: {at: bed, clip: mx_sit_still, blend: 0}, doctor: {at: doctor_side, clip: IdleBreathe, blend: 0, look: person}}
  camera: {preset: spot, from: cam_bed_cu, on: person.head, lens: 65}
  raw:
    - {at: 0, do: fingers, on: person, hand: left, curl: 0.42, for: 0}
    - {at: 0, do: fingers, on: person, hand: right, curl: 0.42, for: 0}
    - {at: 0, do: gaze, on: person, toRel: [0.5, 1.7, 1.0], for: 0}
    - {at: 0.4b, do: face, on: person, jawOpen: 0.8, eyesWide: 0.2, for: 0.3s, ease: out}
    - {at: 3.2b, do: face, on: person, jawOpen: 0, eyesWide: 0, for: 0.25s}

- id: w_nurse
  idea: the nurse looks round at him and does not blink
  feel: she has seen a thousand like him
  cast: {nurse: reception_counter clip:idle}
  camera: {preset: spot, from: cam_nurse_cu, on: nurse, lens: 32}
  raw:
    - {at: 1.3b, do: rotate, on: nurse, rot: [0, 150, 0], for: 0.55s, ease: inout}

