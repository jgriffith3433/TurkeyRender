# Hawkes Punch draft 2 pass 3: the playground. Rules: legs tread (base clip), the upper body relaxes or acts the beat (layers), eyelines to the partner or the lens, a face per line with blinks, everything drifts, the Earth is hand-sized everywhere, wides level so they float in front of Jupiter.

