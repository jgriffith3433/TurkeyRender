# Hawkes Punch, part 2a: the symptoms (J, 2026-11-07). "She's asking him to describe his symptoms and he talks about how he always is listening to
# music and can't stop and is in love with a space ghost. Make that kinda funny." Played straight: he overshares from the paper bed, she sits at the
# desk with her back half to him, eyes on the pad, writing, and never blinks or looks up. 9:1-21:1, 12 bars, then the prescription.
# Voices: tools/punch_lines.mjs (symptoms/*.mp3), each with its jaw. His long line runs from 10:1 (22.87 s); every cut to or from her sits in one of its pauses.
# Doctor: clips only (mx_sit_still), no layers, a gaze to the pad. Him: seated clips on the bed mark (IdleSit13Explain, mx_sit_point, mx_sit_still).

- id: sym_ask
  idea: the wide: he sits on the paper bed waiting; she asks for his symptoms without looking up from the pad
  feel: routine
  cast: {person: {at: bed, clip: mx_sit_still, blend: 0, look: doctor}, doctor: {at: desk_doc, clip: mx_sit_still, blend: 0, look: rx_spot}}
  camera: {preset: spot, from: cam_room_wide, on: cam_room_aim, lens: 26}
  raw:
    - {at: 0.1s, sfx: Assets/MusicVideo/Sfx/punch/chair_creak_a.mp3, volume: 0.25}

- id: sym_music
  idea: I can't stop listening to music: his single, the camera starts creeping in
  feel: oh no, he's going to tell her everything
  cast: {person: {at: bed, clip: IdleSit13Explain, blend: 0, look: doctor}, doctor: {at: desk_doc, clip: mx_sit_still, look: rx_spot}}
  camera: {preset: spot, from: cam_bed_front, on: person.head, lens: 45}
  shot: {dolly: [[700.6, 1.35, 2.2], [700.6, 1.38, 2.62]], ease: linear}

- id: sym_write1
  idea: in the shower, in my sleep: cut to her, eyes on the pad, writing it all down, not a blink
  feel: she has heard worse
  cast: {person: {at: bed, clip: IdleSit13Explain, look: doctor}, doctor: {at: desk_doc, clip: mx_sit_still, look: rx_spot}}
  camera: {preset: spot, from: cam_desk_top, on: doctor, lens: 55}
  raw:
    - {at: 0.3s, sfx: Assets/MusicVideo/Sfx/punch/pen_scratch_a.mp3, volume: 0.4}
    - {at: 0, do: face, on: doctor, blink: 0, eyesWide: 0.05, smile: 0, for: 0}

- id: sym_silence
  idea: I tried silence once, and it was just... more music: back on him, a finger wagging the point home
  feel: he means it
  cast: {person: {at: bed, clip: mx_sit_point, blend: 0, look: doctor}, doctor: {at: desk_doc, clip: mx_sit_still, look: rx_spot}}
  camera: {preset: spot, from: cam_bed_cu, on: person.head, lens: 55}

- id: sym_love
  idea: I'm in love. With a ghost. In space.: he goes still and soft, the camera pushes in slowly
  feel: wait, what
  cast: {person: {at: bed, clip: mx_sit_still, blend: 0, look: doctor}, doctor: {at: desk_doc, clip: mx_sit_still, look: rx_spot}}
  camera: {preset: spot, from: cam_bed_front, on: person.head, lens: 50}
  shot: {dolly: [[700.62, 1.38, 2.45], [700.62, 1.42, 2.95]], ease: linear}
  events:
    - {on: 2.2b, who: person, do: face, smile: 0.25, eyesWide: 0.15, for: 0.8s}

- id: sym_write2
  idea: she doesn't have a face: her again, writing it down, exactly as before
  feel: she is writing "face" on a prescription
  cast: {person: {at: bed, clip: mx_sit_still, look: doctor}, doctor: {at: desk_doc, clip: mx_sit_still, look: rx_spot}}
  camera: {preset: spot, from: cam_desk_top, on: doctor, lens: 65}
  raw:
    - {at: 0.15s, sfx: Assets/MusicVideo/Sfx/punch/pen_scratch_a.mp3, volume: 0.4}
    - {at: 0, do: face, on: doctor, blink: 0, eyesWide: 0.05, smile: 0, for: 0}

- id: sym_vibe
  idea: but she has, like... a vibe: tight on him, the hand searching for the word, then nothing
  feel: he is gone
  cast: {person: {at: bed, clip: IdleSit13Explain, blend: 0, look: doctor}, doctor: {at: desk_doc, clip: mx_sit_still, look: rx_spot}}
  camera: {preset: spot, from: cam_bed_front, on: person.head, lens: 50}
  shot: {pos: [700.62, 1.42, 2.95], look: person.head, rot: null}
  events:
    - {on: 2.6b, who: person, do: face, smile: 0.3, for: 0.6s}

- id: sym_ghost_her
  idea: the beat of silence, the pen stops; then, without looking up: A space ghost.
  feel: deadpan
  cast: {person: {at: bed, clip: mx_sit_still, look: doctor}, doctor: {at: desk_doc, clip: mx_sit_still, look: rx_spot}}
  camera: {preset: spot, from: cam_desk_top, on: doctor, lens: 75}
  raw:
    - {at: 0, do: face, on: doctor, blink: 0, eyesWide: 0.08, smile: 0, for: 0}
    - {at: 1.2s, sfx: Assets/MusicVideo/Sfx/punch/pen_scratch_a.mp3, volume: 0.3}

- id: sym_ghost_him
  idea: ...Space ghost.: tight on him, eyes drifting up and away, the smile of a man in love
  feel: dreamy
  cast: {person: {at: bed, clip: mx_sit_still, look: doctor}, doctor: {at: desk_doc, clip: mx_sit_still, look: rx_spot}}
  camera: {preset: spot, from: cam_bed_front, on: person.head, lens: 55}
  shot: {pos: [700.62, 1.42, 2.95], look: person.head, rot: null}
  raw:
    - {at: 0.25s, do: gaze, on: person, toRel: [-1.2, 2.4, 3], for: 0.8s, ease: inout}
    - {at: 0.3s, do: perform, on: person, name: smile_small, amount: 0.7, hold: 2}
    - {at: 2.6s, do: blink, on: person, for: 0.3s}
