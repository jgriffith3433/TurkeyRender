# Hawkes Punch, space: alone, cat and mouse, worlds, the stop. Space origin is [0,300,1500]: a world point is local + that. Marks: library/sets/space.json.
# Every stunt is one clear event on a bar, read as a silhouette against a planet. Planets are set pieces: space_saturn, space_mars, space_jupiter, space_earth, space_moon, space_comet, space_satellite.
# The stunts don't grow strictly bar by bar: the lyric anchors ("tag" 82.9, "hide behind a planet" 84.9, "boo" 87.2, "rope a ring" 89.1) fix their order.
# Native path (2026-11-07): bodies are clips (mx_falling_air, mx_treading_water, mx_flying_idle for flight, mx_throw, mx_pull_rope, mx_goalie_catch_mid,
# mx_stomach_hit, mx_roundhouse_kick, mx_hit_reaction, mx_boxing_dodge, mx_taunt_flex); reach, gaze and the face go on top.
# Thrown worlds shrink to a ball on the way (dodgeball logic) and grow back when they leave. The put-back Earth is `earth_small`: it grows to a planet and stays behind the stop.

