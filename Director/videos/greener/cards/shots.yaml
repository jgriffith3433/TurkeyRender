    - {at: 0.5b, do: reach, on: person, hand: right, to: [299.95, 1.08, 0.44], hint: [299.72, 0.72, 0.52], handRot: [0, 180, 90], for: 0.42s, ease: hand, lint: point}
    - {at: 0.5b, do: fingers, on: person, hand: right, set: 0.9, for: 0.2s}
    - {at: 0.5b, do: fingers, on: person, hand: right, finger: index, set: 0.03, for: 0.2s}
    - {at: 2.5b, do: reach, on: person, hand: right, weight: 0, for: 0.3s, ease: inout}
    - {at: 2.7b, do: fingers, on: person, hand: right, release: 1, for: 0.2s}

- id: sparrow_away
