# Gateway Drug: bars and beats from LYRIC-MAP.md. Grass is the gateway drug, and nothing on screen says so. He moves as if in a big party dress he is not wearing.

# ---- the yard
- id: yard_wide
  idea: a scruffy yard and a man in a cheap lawn chair, knees together, holding a look at us
  feel: a stranger who knows something
  cast: {lawn_chair: {at: chair}, person: {at: chair, perform: dress_sit}}
  camera: {preset: spot, from: chair_wide, on: chair_aim, lens: 28}
  raw:
    - {at: 0, do: show, on: cup_mug}
    - {at: 0, do: reach, on: person, hand: left, to: [300.25, 0.69, 0.258], for: 0, lint: point}
    - {at: 0, do: fingers, on: person, hand: left, set: 0.62, for: 0}
    - {at: 0, do: fingers, on: person, hand: left, finger: thumb, set: 0.5, for: 0}

- id: hem
  idea: tight on his lap, he smooths an invisible skirt over his knees, twice
  feel: wait, what is he doing
  cast: {lawn_chair: {at: chair}, person: {at: chair, perform: dress_sit}}
  camera: {preset: medium, on: person.hips, frame: 0.8}
  raw:
    - {at: 0, do: show, on: cup_mug}
    - {at: 0, do: reach, on: person, hand: left, to: [300.25, 0.69, 0.258], for: 0, lint: point}
    - {at: 0, do: fingers, on: person, hand: left, set: 0.62, for: 0}
    - {at: 0, do: fingers, on: person, hand: left, finger: thumb, set: 0.5, for: 0}
  events:
    - {on: 1b, who: person, do: perform, name: hem_smooth, for: 1.6s}
    - {on: 5b, who: person, do: perform, name: hem_smooth, for: 1.6s}

- id: funny
  idea: "Oh, isn't it funny?" spoken to camera, one small head tilt
  feel: he has us
  sing: person
  cast: {lawn_chair: {at: chair}, person: {at: chair, perform: sit_lawn_chair_sing}}
  camera: {preset: close-up, on: person, frame: 0.62}
  events:
    - {on: 4.5b, who: person, do: pose, bones: {head: [0, 0, 8], neck: [0, 0, 4]}, for: 0.5s, ease: inout}
    - {on: 7b, who: person, do: pose, bones: {head: [0, 0, 0], neck: [0, 0, 0]}, for: 0.5s, ease: inout}
  raw:
    - {at: 0, do: show, on: cup_mug}
    - {at: 0, do: reach, on: person, hand: left, to: [300.25, 0.69, 0.258], for: 0, lint: point}
    - {at: 0, do: fingers, on: person, hand: left, set: 0.62, for: 0}
    - {at: 0, do: fingers, on: person, hand: left, finger: thumb, set: 0.5, for: 0}

- id: secret
  idea: on "secret" he lifts one hand beside his face and there is one blade of grass
  feel: a secret the size of nothing
  sing: person
  cast: {lawn_chair: {at: chair}, person: {at: chair, perform: sit_lawn_chair_sing}}
  camera: {preset: close-up, on: person, frame: 0.95, push: 0.15}
  raw:
    - {at: 0, do: show, on: cup_mug}
    - {at: 0, do: reach, on: person, hand: left, to: [300.25, 0.69, 0.258], for: 0, lint: point}
    - {at: 0, do: fingers, on: person, hand: left, set: 0.62, for: 0}
    - {at: 0, do: fingers, on: person, hand: left, finger: thumb, set: 0.5, for: 0}
    - {at: 2.2b, do: reach, on: person, hand: right, to: [299.66, 1.22, 0.3], for: 0.5s, ease: hand, lint: point}
    - {at: 2.2b, do: fingers, on: person, hand: right, finger: thumb, set: 0.85, for: 0.2s}
    - {at: 2.2b, do: fingers, on: person, hand: right, finger: index, set: 0.8, for: 0.2s}
    - {at: 2.2b, do: fingers, on: person, hand: right, finger: middle, set: 0.34, for: 0.2s}
    - {at: 2.2b, do: fingers, on: person, hand: right, finger: ring, set: 0.36, for: 0.2s}
    - {at: 2.2b, do: fingers, on: person, hand: right, finger: pinky, set: 0.4, for: 0.2s}
    - {at: 3.4b, do: show, on: blade_hand}
    - {at: 3.4b, do: pop, on: blade_hand, for: 0.6b}
    - {at: 7.1b, do: reach, on: person, hand: right, weight: 0, for: 0.35s, ease: inout}
    - {at: 7.7b, do: fingers, on: person, hand: right, release: 1, for: 0.1s}
    - {at: 7.7b, do: hide, on: blade_hand}

- id: lips
  idea: "nothing you should know", one finger up to his lips for a beat, and back
  feel: we are in on it now
