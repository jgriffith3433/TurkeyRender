    - {at: 0, do: fingers, on: person, hand: left, set: 0.62, for: 0}
    - {at: 0, do: fingers, on: person, hand: left, finger: thumb, set: 0.5, for: 0}

- id: happens
  idea: "mine just happens to be so", sung flat, ankles crossed by the look of him
  feel: he won't say and we can see it
  sing: person
  cast: {lawn_chair: {at: chair}, person: {at: chair, perform: sit_lawn_chair_sing}}
  camera: {preset: close-up, on: person, side: left}
  raw:
    - {at: 0, do: show, on: cup_mug}
    - {at: 0, do: reach, on: person, hand: left, to: [300.25, 0.69, 0.258], for: 0, lint: point}
    - {at: 0, do: fingers, on: person, hand: left, set: 0.62, for: 0}
    - {at: 0, do: fingers, on: person, hand: left, finger: thumb, set: 0.5, for: 0}
    - {at: 9.9b, do: hide, on: blade_hand}

- id: irresponsible
  idea: he glides the fence line, hips first, and flicks a bit of grass over his shoulder
  feel: this man has never doubted a thing
  sing: person
  cast: {person: {at: fence_a, to: fence_b, perform: dress_walk, face: 90}}
  camera: {preset: spot, from: fence_cam, on: person, lens: 45}
  raw:
    - {at: 0, do: hide, on: cup_mug}
    - {at: 0, do: reach, on: person, hand: left, weight: 0, for: 0}
    - {at: 0, do: fingers, on: person, hand: left, release: 1, for: 0}
    - {at: 3.5b, do: perform, on: person, name: hand_flourish, clip: Idle1Greet, for: 1.2s}

- id: what_you_like
  idea: he stops and waves the world away with one slow hand
  feel: oh, the nerve
  sing: person
  cast: {person: {at: fence_b, perform: dress_groove}}
  camera: {preset: medium, on: person, frame: 2}
  raw:
    - {at: 1b, do: perform, on: person, name: hand_flourish, clip: Idle1Greet, mask: rightArm, start: 0.3, for: 2.2s}

- id: glide
  idea: on he goes along the fence, skirt in hand
  feel: a catwalk made of weeds
  sing: person
  cast: {person: {at: fence_b, to: fence_c, perform: dress_walk, face: 90, args: {stride: 0.99}}}
  camera: {preset: spot, from: fence_cam, on: person, lens: 32}

- id: curtsy
  idea: "respectable", and a full curtsy to the fence
  feel: total dignity
  sing: person
  cast: {person: {at: fence_c, perform: dress_curtsy}}
  camera: {preset: medium, on: person, frame: 1.8}

- id: tonight
  idea: "until tonight", a flat look at us
  mood: yard_face
  feel: uh oh
  sing: person
  cast: {person: {at: fence_c, perform: dress_groove}}
  camera: {preset: close-up, on: person, frame: 0.62}

