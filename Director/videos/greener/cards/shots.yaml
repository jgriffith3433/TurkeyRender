    - {at: 2b, do: scale, on: pastel_a, to: [15, 0.01, 15], for: 1b, ease: out}
    - {at: 3b, do: scale, on: pastel_b, to: [11, 0.01, 11], for: 1b, ease: out}
    - {at: 0, do: topple, on: fence_p1, pivot: [0, 0, 0], axis: [1, 0, 0], angle: 86, bounce: 0.12, land: "27:2", for: 2.4b}
    - {at: 0.1b, do: topple, on: fence_p6, pivot: [0, 0, 0], axis: [1, 0, 0], angle: 86, bounce: 0.12, land: "27:3", for: 2.4b}
