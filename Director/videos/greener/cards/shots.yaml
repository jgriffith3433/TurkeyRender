    - {at: 0.25b, do: rotate, on: sparrow_head, rot: [0, -35, 0], for: 0.07s, ease: out}
    - {at: 0.8b, do: rotate, on: sparrow_tail, rot: [-32, 0, 0], for: 0.06s, ease: out}
    - {at: 1b, do: rotate, on: sparrow_tail, rot: [0, 0, 0], for: 0.14s, ease: out}
    - {at: 1.2b, do: rotate, on: sparrow_head, rot: [12, 28, 12], for: 0.07s, ease: out}
    - {at: 1.9b, do: rotate, on: sparrow_head, rot: [0, 0, 0], for: 0.06s, ease: out}
    - {at: 2b, do: rotate, on: sparrow, rot: [0, 195, 0], for: 0.22s, ease: out}
    - {at: 2b, do: jump, on: sparrow, pos: [0, 0, 0], rel: 1, height: 0.02, for: 0.22s}
    - {at: 2.1b, do: rotate, on: sparrow_tail, rot: [-38, 0, 0], for: 0.06s, ease: out}
    - {at: 2.5b, do: rotate, on: sparrow_tail, rot: [0, 0, 0], for: 0.14s, ease: out}
    - {at: 3.1b, do: rotate, on: sparrow_head, rot: [0, 60, 0], for: 0.07s, ease: out}
    - {at: 3.6b, do: rotate, on: sparrow_head, rot: [0, 0, 0], for: 0.06s, ease: out}

- id: weakness
  idea: on "weakness" his eyes go to the house, then away, fast
  feel: something in there
  cast: {lawn_chair: {at: chair}, person: {at: chair, perform: sit_lawn_chair_sing}}
  camera: {preset: close-up, on: person, frame: 0.62}
  raw:
    - {at: 0, do: show, on: cup_mug}
    - {at: 0, do: reach, on: person, hand: left, to: [300.25, 0.69, 0.258], for: 0, lint: point}
    - {at: 0, do: fingers, on: person, hand: left, set: 0.62, for: 0}
    - {at: 0, do: fingers, on: person, hand: left, finger: thumb, set: 0.5, for: 0}
    - {at: 0.4b, do: layer, on: person, clip: Idle1Apologize, mask: rightArm, start: 0.4, weight: 0.9, for: 2.2b, blend: 0.2s}
    - {at: 1.6b, do: gaze, on: person, toRel: [-3, 1.2, -4], for: 0.2s, ease: out, limit: 50}
    - {at: 3.4b, do: gaze, on: person, weight: 0, for: 0.14s}

- id: dark_tv
  idea: through the window, a dark TV
  feel: the old habit
  camera: {preset: spot, from: window_cam, on: window_aim, lens: 50}
  raw:
    - {at: 0, do: show, on: cup_mug}
