# The epic toolkit's proof (AGENTS.md "Epic toolkit"). Times in a card are from its own start. 24 fps: a frame is 0.0417 s.
- id: windup
  idea: he winds up and holds the cocked pose, trembling, lines gathering on the fist, then strikes in three frames
  feel: power gathering, then a snap
  look: epic
  cast: {person: {at: him, clip: mx_cross_punch, blend: 0}, boulder: {at: rock}}
  camera: {preset: spot, from: cam_low, on: person.chest, lens: 24}
  shot: {deadzone: false}
  raw:
    - {at: 0, do: anim, on: person, clip: mx_cross_punch, rate: 0.5, blend: 0}
    - {at: 0.01s, grade: {exposure: 0.3}, for: 0}
    - {at: 1.47s, do: freeze, on: person, frames: 14, tremble: 0.006}
    - {at: 1.47s, do: speedlines, style: radial, on: person.rightHand, amount: 0.55, for: 0.6s, fadeIn: 0.15s, fadeOut: 0.04s, clear: 0.3, density: 0.4}
    - {at: 2.07s, do: anim, on: person, clip: mx_cross_punch, start: 0.733, rate: 3, blend: 0}
    - {at: 2.07s, sfx: feather_whoosh, sfxVolume: 0.9}
    - {at: 2.135s, do: smear, on: person.rightHand, frames: 1, style: both, length: 0.45, copies: 3, fan: 12}
- id: hit
  idea: contact; the frame goes two-tone, everything holds as the boulder shakes, then it bursts, the ring tears out and the camera takes the blow
  feel: the hit lands in silence and then everything goes
  look: epic
  cast: {person: {at: him}, boulder: {at: rock}}
  camera: {preset: spot, from: cam_hit, on: hit_aim, lens: 28}
  shot: {deadzone: false}
  raw:
    - {at: 0, do: silence, frames: 4}
    - {at: 0, do: impactframe, style: flip, flash: 1, frames: 2, on: boulder}
    - {at: 0, do: hitstop, on: person, frames: 8, victim: boulder, victimShake: 0.035, axis: [1, 0, 0]}
    - {at: 0, sfx: impact_big, sfxVolume: 1}
    - {at: 0, do: shake, trauma: 0.45, for: 0.33s}
    - {at: 0.333s, do: anim, on: person, clip: mx_cross_punch, start: 1.12, rate: 0.6, once: 1, blend: 0}
    - {at: 0.333s, do: hide, on: boulder}
    - {at: 0.333s, fx: shock, on: boulder, size: 1.3, for: 0.4s, width: 0.06, distort: 0.6, glow: 0.06}
    - {at: 0.333s, fx: debris, on: boulder, kind: ice, size: 1.4, count: 160, speed: 4, normal: [0, 0.1, 1], spread: 80, drag: 0.3, for: 4.85s, dust: 24, dustColor: "#8c847870"}
    - {at: 0.333s, do: shake, trauma: 1, punch: 0.06, for: 0.75s}
    - {at: 0.333s, do: speedlines, style: radial, on: boulder, amount: 0.9, for: 0.5s, fadeOut: 0.25s, clear: 0.2}
- id: wide
  idea: the wide: a tiny man, a ring still spreading, the ice drifting out and the dust hanging
  feel: scale; it was a lot
  look: epic
  cast: {person: {at: him}}
  camera: {preset: spot, from: cam_wide, on: wide_aim, lens: 32}
  shot: {deadzone: false}
  raw:
    - {at: 0, fx: shock, pos: [0.15, 1.34, 6001.6], normal: [0.6, 0.2, 1], size: 10, for: 1.4s, width: 0.06, distort: 0, alpha: 1, fill: 0.1}
- id: deadpan
  idea: his face, flat and lit from the front, nothing on it at all
  feel: deadpan
  look: plain
  cast: {person: {at: him}}
  camera: {preset: spot, from: cam_face, on: person.head, lens: 55}
  shot: {deadzone: false}
  tags: [ecu]
  raw:
    - {at: 0, do: face, on: person, smile: 0, eyesWide: 0, fear: 0, jawOpen: 0, for: 0}
    - {at: 1.3s, do: blink, on: person, for: 0.15s}
