about: Slides across (root: the travel, 0.9 m to his right is [-0.9, 0, 0] as he faces -z), hand on hip, shoulders leading. The arms run on 4 beats past the slide so the walk that follows keeps the hand on the hip.
kind: slide
len: 4b
cues:
  - {at: 0b, do: anim, clip: mx_slide_step, start: 0.25, speed: 1.3, warpTo: beat, maxRate: 1.25, blend: 0.14, for: $len}
  - {at: 0b, do: layer, clip: mx_hh_booty_step, mask: arms, start: 2.4, weight: 1, for: 3.8b, blend: 0.15}
  - {at: 4b, do: layer, clip: mx_hh_booty_step, mask: arms, start: 2.5, weight: 1, for: 3.6b, blend: 0.15}
  - {at: 0.2b, do: move, pos: $root, rel: 1, for: 3.6b, ease: inout, lint: slide}
